version: '3.8'

services:
  # Reverse Proxy & SSL Gateway
  gateway:
    image: nginx:alpine
    container_name: ghostnet_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghostnet_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ghostnet:ghostnet_pass@postgres:5432/ghostnet_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=ghostnet-media
      - OPEN_METEO_BASE_URL=https://marine-api.open-meteo.com/v1/marine
    depends_on:
      - postgres
      - redis
      - minio

  # Celery Asynchronous Worker (Drift Simulation & Risk Engine)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ghostnet_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info -Q drift_tasks,sync_tasks
    environment:
      - DATABASE_URL=postgresql://ghostnet:ghostnet_pass@postgres:5432/ghostnet_db
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET_NAME=ghostnet-media
    depends_on:
      - postgres
      - redis
      - minio

  # PostgreSQL 16 with PostGIS Geospatial Extension
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: ghostnet_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ghostnet
      - POSTGRES_PASSWORD=ghostnet_pass
      - POSTGRES_DB=ghostnet_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis In-Memory Message Broker & Forecast Cache
  redis:
    image: redis:7-alpine
    container_name: ghostnet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # MinIO S3-Compatible Object Store (Gear Photos & Offline ZIP Packages)
  minio:
    image: minio/minio:latest
    container_name: ghostnet_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data

  # Web Admin Dashboard (Vite React SPA)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ghostnet_web
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
